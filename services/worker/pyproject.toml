[project]
name = "interiores-worker"
version = "0.1.0"
description = "Worker da fila (arq + Redis): renders do Blender com progresso ao vivo."
requires-python = ">=3.12"
dependencies = [
    "interiores-core",
    "interiores-banco",
    "interiores-render",
    "arq>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_worker"]

[tool.uv.sources]
interiores-core = { workspace = true }
interiores-banco = { workspace = true }
interiores-render = { workspace = true }

[project.scripts]
interiores-worker = "interiores_worker.fila:rodar"
