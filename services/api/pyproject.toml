[project]
name = "interiores-api"
version = "0.1.0"
description = "API HTTP (FastAPI): projetos, edição da planta, problemas e histórico."
requires-python = ">=3.12"
dependencies = [
    "interiores-core",
    "interiores-banco",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_api"]

[tool.uv.sources]
interiores-core = { workspace = true }
interiores-banco = { workspace = true }

[project.scripts]
interiores-api = "interiores_api.app:rodar"
