# Infra base + wiki. api, worker, blender e frontend entram quando seus Dockerfiles existirem.
# Versões sempre fixadas (CLAUDE.md §10).
name: interiores

services:
  db:
    image: postgres:16.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4.7
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # fork comunitário; minio/minio saiu do Docker Hub
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: [minio-data:/data]

  wiki:
    # Wiki.js 2.5 (SQLite próprio, não usa o Postgres do projeto). As páginas são os
    # Markdown versionados em docs/wiki/: Admin > Armazenamento > Sistema de arquivos
    # local, caminho /wiki/docs, "Importar tudo" (ver docs/wiki/home.md).
    image: requarks/wiki:2.5.317
    environment:
      DB_TYPE: sqlite
      DB_FILEPATH: /wiki/data/db.sqlite
    ports: ["${WIKI_PORT:-3000}:3000"]
    volumes:
      - wiki-data:/wiki/data
      - ./docs/wiki:/wiki/docs

volumes:
  db-data:
  redis-data:
  minio-data:
  wiki-data:
