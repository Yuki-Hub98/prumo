[project]
name = "interiores-core"
version = "0.1.0"
description = "Modelo de medidas, validação, regras e geometria (Python puro)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_core"]
