[project]
name = "interiores-cad"
version = "0.1.0"
description = "Plantas, cortes e elevações em DXF/PDF."
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.5",
    "interiores-core",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_cad"]

[tool.uv.sources]
interiores-core = { workspace = true }
