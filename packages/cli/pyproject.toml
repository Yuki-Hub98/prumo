[project]
name = "interiores-cli"
version = "0.1.0"
description = "Comando de linha `interiores`."
requires-python = ">=3.12"
dependencies = [
    "interiores-core",
    "interiores-cad",
    "interiores-render",
    "interiores-relatorios",
    "typer>=0.29.1",
    "structlog>=26.1.0",
    "interiores-banco",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_cli"]

[tool.uv.sources]
interiores-core = { workspace = true }
interiores-cad = { workspace = true }
interiores-render = { workspace = true }
interiores-relatorios = { workspace = true }
interiores-banco = { workspace = true }

[project.scripts]
interiores = "interiores_cli.main:app"
