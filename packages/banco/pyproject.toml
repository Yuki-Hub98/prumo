[project]
name = "interiores-banco"
version = "0.1.0"
description = "PostgreSQL como fonte da verdade: tabelas, migrações, importar/exportar o JSON."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "interiores-core",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_banco"]

[tool.uv.sources]
interiores-core = { workspace = true }
