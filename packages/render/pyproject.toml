[project]
name = "interiores-render"
version = "0.1.0"
description = "Scripts bpy e orquestração do Blender (só core + stdlib)."
requires-python = ">=3.11"
dependencies = ["interiores-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_render"]

[tool.uv.sources]
interiores-core = { workspace = true }
